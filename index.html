<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Espíritus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="ambient-glow"></div>

  <div id="authModal" class="auth-modal">
    <div class="auth-container">
      <h2 class="auth-title">Espíritus</h2>
      <div id="authTabs" class="auth-tabs">
        <button id="loginTab" class="auth-tab active">Iniciar Sesión</button>
        <button id="registerTab" class="auth-tab">Registrarse</button>
      </div>
<form id="authForm" class="auth-form">
        <div id="emailField" class="form-group">
          <label for="email">Usuario</label>
          <input type="text" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="6" />
        </div>
        <div id="confirmField" class="form-group" style="display: none;">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" minlength="6" />
        </div>
        <button type="submit" id="authSubmit" class="auth-btn">Iniciar Sesión</button>
        <p id="authError" class="auth-error"></p>
      </form>
    </div>
  </div>

  <main id="appContent" class="hidden">
    <header class="tracker-hud">
      <div class="hud-left">
        <div class="hud-label">SEASON 7 · CHAPTER 3</div>
        <h1 class="hud-title">Espíritus</h1>
      </div>
      <div class="hud-right">
        <div class="stat-block">
          <span class="stat-value" id="dominatedCount">0</span>
          <span class="stat-label">Dominados</span>
        </div>
        <div class="stat-block">
          <span class="stat-value" id="registeredCount">0</span>
          <span class="stat-label">Obtenidos</span>
        </div>
        <div class="stat-block">
          <span class="stat-value" id="totalSpirits">0</span>
          <span class="stat-label">Total</span>
        </div>
      </div>
      <div class="hud-controls">
        <div class="sort-block">
          <label for="sortSelect">Ordenar</label>
          <select id="sortSelect">
            <option value="default">Predeterminado</option>
            <option value="registered">Obtenidos</option>
            <option value="rarity">Rareza</option>
            <option value="status">Dominados</option>
            <option value="notRegistered">No obtenidos</option>
            <option value="notDominated">No dominados</option>
          </select>
        </div>
        <button id="resetAll" class="btn-reset">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reiniciar todo
        </button>
        <button id="logoutBtn" class="btn-reset">Cerrar Sesión</button>
      </div>
    </header>

    <section class="containment-grid">
      <div id="spiritGrid" class="grid"></div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>

</html>
